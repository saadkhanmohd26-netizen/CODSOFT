<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:        #1a1a2e;
      --panel:     #16213e;
      --display:   #0f3460;
      --accent:    #e94560;
      --eq-glow:   #ff6b6b;
      --op-btn:    #1d3557;
      --num-btn:   #162447;
      --text-main: #eaeaea;
      --text-dim:  #a0aec0;
      --shadow:    rgba(233, 69, 96, 0.25);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'Share Tech Mono', monospace;
      /* subtle scanline texture */
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(255,255,255,0.015) 2px,
          rgba(255,255,255,0.015) 4px
        );
    }

    .calc-shell {
      position: relative;
      width: 340px;
      background: var(--panel);
      border-radius: 24px 24px 32px 32px;
      padding: 28px 24px 32px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 24px 60px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--text-dim);
      text-align: center;
      margin-bottom: 18px;
      opacity: 0.6;
    }

    /* --- display --- */
    .display-box {
      background: var(--display);
      border-radius: 12px;
      padding: 14px 18px 12px;
      margin-bottom: 22px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow:
        inset 0 2px 8px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,255,255,0.05);
      overflow: hidden;
    }

    .display-history {
      font-size: 12px;
      color: var(--text-dim);
      text-align: right;
      min-height: 16px;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .display-main {
      font-size: 40px;
      color: var(--text-main);
      text-align: right;
      letter-spacing: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.15s;
    }

    .display-main.flash {
      color: var(--accent);
    }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      all: unset;
      cursor: pointer;
      border-radius: 10px;
      height: 60px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: transform 0.08s, box-shadow 0.08s, background 0.1s;
      position: relative;
      overflow: hidden;
    }
    button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.07);
      opacity: 0;
      border-radius: inherit;
      transition: opacity 0.2s;
    }
    button:hover::after  { opacity: 1; }
    button:active::after { opacity: 0; }

    button:active {
      transform: scale(0.93);
    }
    .btn-num {
      background: var(--num-btn);
      color: var(--text-main);
      box-shadow: 0 4px 0 #0c1830, 0 6px 12px rgba(0,0,0,0.3);
    }
    .btn-num:active {
      box-shadow: 0 1px 0 #0c1830, 0 2px 6px rgba(0,0,0,0.2);
    }
    .btn-op {
      background: var(--op-btn);
      color: #90caf9;
      box-shadow: 0 4px 0 #0d1f36, 0 6px 12px rgba(0,0,0,0.3);
    }
    .btn-op:active {
      box-shadow: 0 1px 0 #0d1f36;
    }
    .btn-op.active-op {
      background: #1e4a7a;
      color: #fff;
      box-shadow: 0 0 10px rgba(100, 180, 255, 0.3), 0 4px 0 #0d1f36;
    }
    .btn-eq {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 0 #a5192e, 0 6px 18px var(--shadow);
    }
    .btn-eq:active {
      box-shadow: 0 1px 0 #a5192e, 0 2px 6px var(--shadow);
    }
    .btn-clear {
      background: #2d2d44;
      color: #fc9d9d;
      box-shadow: 0 4px 0 #1a1a2a, 0 6px 12px rgba(0,0,0,0.3);
    }
    .btn-clear:active {
      box-shadow: 0 1px 0 #1a1a2a;
    }
    .btn-zero {
      grid-column: span 2;
      justify-content: flex-start;
      padding-left: 22px;
    }
    .vent {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 20px;
    }
    .vent span {
      width: 28px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>

<div class="calc-shell">
  <div class="led"></div>
  <div class="brand">CALC </div>

  <div class="display-box">
    <div class="display-history" id="history">&nbsp;</div>
    <div class="display-main"  id="mainDisplay">0</div>
  </div>

  <div class="btn-grid">
    <!-- row 1 -->
    <button class="btn-clear" data-action="clear">AC</button>
    <button class="btn-clear" data-action="sign">+/−</button>
    <button class="btn-clear" data-action="percent">%</button>
    <button class="btn-op"    data-action="op" data-op="÷">÷</button>

    <!-- row 2 -->
    <button class="btn-num" data-action="digit" data-val="7">7</button>
    <button class="btn-num" data-action="digit" data-val="8">8</button>
    <button class="btn-num" data-action="digit" data-val="9">9</button>
    <button class="btn-op"  data-action="op"    data-op="×">×</button>

    <!-- row 3 -->
    <button class="btn-num" data-action="digit" data-val="4">4</button>
    <button class="btn-num" data-action="digit" data-val="5">5</button>
    <button class="btn-num" data-action="digit" data-val="6">6</button>
    <button class="btn-op"  data-action="op"    data-op="−">−</button>

    <!-- row 4 -->
    <button class="btn-num" data-action="digit" data-val="1">1</button>
    <button class="btn-num" data-action="digit" data-val="2">2</button>
    <button class="btn-num" data-action="digit" data-val="3">3</button>
    <button class="btn-op"  data-action="op"    data-op="+">+</button>

    <!-- row 5 -->
    <button class="btn-num btn-zero" data-action="digit" data-val="0">0</button>
    <button class="btn-num" data-action="decimal">.</button>
    <button class="btn-eq"  data-action="equals">=</button>
  </div>

  <div class="vent">
    <span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </div>
</div>

<script>
  var currentVal   = '0';     
  var storedVal    = null;  
  var chosenOp     = null;  
  var freshInput   = false; 

  var display = document.getElementById('mainDisplay');
  var history = document.getElementById('history');

  function updateDisplay(val) {
    var s = String(val);
    if (s.length > 12) s = parseFloat(parseFloat(val).toPrecision(10)).toString();
    display.textContent = s;
  }

  function flashDisplay() {
    display.classList.add('flash');
    setTimeout(function() { display.classList.remove('flash'); }, 200);
  }

  function highlightOp(op) {
    var ops = document.querySelectorAll('.btn-op');
    for (var i = 0; i < ops.length; i++) {
      ops[i].classList.remove('active-op');
    }
    if (op) {
      for (var j = 0; j < ops.length; j++) {
        if (ops[j].dataset.op === op) {
          ops[j].classList.add('active-op');
        }
      }
    }
  }
  function calculate(a, b, op) {
    a = parseFloat(a);
    b = parseFloat(b);
    var result;
    if (op === '+')  result = a + b;
    if (op === '−')  result = a - b;
    if (op === '×')  result = a * b;
    if (op === '÷') {
      if (b === 0) return 'Error';
      result = a / b;
    }
    return parseFloat(result.toPrecision(12));
  }
  document.querySelector('.btn-grid').addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;

    var action = btn.dataset.action;
    if (action === 'digit') {
      var digit = btn.dataset.val;

      if (freshInput) {
        currentVal = digit;
        freshInput = false;
      } else {
        if (currentVal === '0') {
          currentVal = digit;
        } else {
          if (currentVal.length < 12) currentVal += digit;
        }
      }
      updateDisplay(currentVal);
    }
    else if (action === 'decimal') {
      if (freshInput) { currentVal = '0'; freshInput = false; }
      if (currentVal.indexOf('.') === -1) {
        currentVal += '.';
      }
      updateDisplay(currentVal);
    }
    else if (action === 'op') {
      var op = btn.dataset.op;
      if (chosenOp !== null && !freshInput) {
        var chained = calculate(storedVal, currentVal, chosenOp);
        currentVal = String(chained);
        updateDisplay(currentVal);
        flashDisplay();
      }

      storedVal  = currentVal;
      chosenOp   = op;
      freshInput = true;
      history.textContent = storedVal + ' ' + op;
      highlightOp(op);
    }
    else if (action === 'equals') {
      if (chosenOp === null || storedVal === null) return;

      history.textContent = storedVal + ' ' + chosenOp + ' ' + currentVal + ' =';
      var result = calculate(storedVal, currentVal, chosenOp);
      currentVal = String(result);
      updateDisplay(currentVal);
      flashDisplay();
      storedVal  = null;
      chosenOp   = null;
      freshInput = true;
      highlightOp(null);
    }
    else if (action === 'clear') {
      currentVal = '0';
      storedVal  = null;
      chosenOp   = null;
      freshInput = false;
      history.textContent = '\u00a0';
      updateDisplay('0');
      highlightOp(null);
    }
    else if (action === 'sign') {
      var n = parseFloat(currentVal);
      if (n !== 0) {
        currentVal = String(n * -1);
        updateDisplay(currentVal);
      }
    }
    else if (action === 'percent') {
      currentVal = String(parseFloat(currentVal) / 100);
      updateDisplay(currentVal);
    }
  });
  document.addEventListener('keydown', function(e) {
    var key = e.key;
    var map = { '/' : '÷', '*' : '×', '-' : '−', '+' : '+' };

    if (key >= '0' && key <= '9') {
      document.querySelector('[data-val="' + key + '"]').click();
    } else if (key === '.') {
      document.querySelector('[data-action="decimal"]').click();
    } else if (key in map) {
      document.querySelector('[data-op="' + map[key] + '"]').click();
    } else if (key === 'Enter' || key === '=') {
      document.querySelector('[data-action="equals"]').click();
    } else if (key === 'Backspace' || key === 'Escape') {
      document.querySelector('[data-action="clear"]').click();
    } else if (key === '%') {
      document.querySelector('[data-action="percent"]').click();
    }
  });
</script>
</body>
</html>
